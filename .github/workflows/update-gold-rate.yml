name: Update Daily Bangalore Gold Rates

on:
  schedule:
    # 04:00 UTC is 09:30 AM IST (morning rate update)
    - cron: '0 4 * * *'
    # 06:30 UTC is 12:00 PM IST (mid-day review update)
    - cron: '30 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest Bangalore Gold Rates
        run: node scripts/fetch-rate.js

      - name: Commit and Push Updated Rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live Bangalore gold rates [$(date +'%Y-%m-%d')]" && git push)
